<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QKD Prediction Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-lg shadow-md">
        <h1 class="text-2xl font-bold mb-4">QKD Parameter Prediction</h1>
        <form id="predictionForm" class="space-y-4">
            <div>
                <label for="fiberLength" class="block text-sm font-medium text-gray-700">Fiber Length (km)</label>
                <input type="number" id="fiberLength" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" min="0" max="200" required>
            </div>
            <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded-md">Predict</button>
        </form>
        <div id="results" class="mt-4"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
